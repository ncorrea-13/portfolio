version: 2
multi-ecosystem-groups:
  all:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    patterns: ["*"]
    multi-ecosystem-group: "all"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    patterns: ["*"]
    multi-ecosystem-group: "all"
