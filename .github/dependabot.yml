version: 2
multi-ecosystem-groups:
  all:
    target-branch: "main"
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all"
    ignore:
      # typescript-eslint does not support TS >=7 yet (typescript-eslint#10940)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all"
