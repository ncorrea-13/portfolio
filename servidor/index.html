    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", stored || "dark");
      })();
      function toggleTheme() {
        var current = document.documentElement.getAttribute("data-theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        var effectiveCurrent = current || (prefersDark ? "dark" : "light");
        var next = effectiveCurrent === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        if (typeof updateDiagrams === "function") {
          updateDiagrams(next);
        }
      }
    </script>

      var STATUS_API_URL = "https://status.ncorrea.com.ar/api/status";

      function formatCheckedAt(raw, lang) {
        if (!raw) return null;
        var d = new Date(raw);
        if (isNaN(d.getTime())) return null;
        return d.toLocaleString(lang === "en" ? "en-US" : "es-AR", {
          timeZone: "America/Argentina/Mendoza",
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }
      function renderStatus(services, lang) {
        var dict = translations[lang];
        var box = document.getElementById("status-box");
        var summary = document.getElementById("status-summary");
        var headline = document.getElementById("status-headline");
        var list = document.getElementById("status-list");
        var anyDown = services.some(function (s) {
          return s.status === "down";
        });
        var upCount = services.filter(function (s) {
          return s.status === "up";
        }).length;

        box.classList.toggle("status-down", anyDown);
        summary.textContent = upCount + "/" + services.length;
        headline.textContent = anyDown ? dict.statusSomeDown : dict.statusAllUp;

        list.innerHTML = "";
        services.forEach(function (s) {
          var status = s.status || "unknown";
          var li = document.createElement("li");

          var nameSpan = document.createElement("span");
          nameSpan.className = "status-name";
          var dot = document.createElement("span");
          dot.className = "status-dot " + status;
          nameSpan.appendChild(dot);
          nameSpan.appendChild(document.createTextNode(s.name));

          var metaSpan = document.createElement("span");
          metaSpan.className = "status-meta";
          var checkedAt = formatCheckedAt(s.checked_at, lang);
          var statusLabel =
            dict["status" + status.charAt(0).toUpperCase() + status.slice(1)] ||
            dict.statusUnknown;
          // Kuma notifica solo cuando cambia el estado: checked_at es "desde cuándo", no "último chequeo".
          metaSpan.textContent = checkedAt
            ? statusLabel + " · " + dict.statusSince + " " + checkedAt
            : statusLabel + " · " + dict.statusNever;

          li.appendChild(nameSpan);
          li.appendChild(metaSpan);
          list.appendChild(li);
        });
      }

      function loadStatus() {
        var lang = document.documentElement.lang === "en" ? "en" : "es";
        var dict = translations[lang];
        var headline = document.getElementById("status-headline");
        headline.innerHTML =
          '<span class="status-loading">' + dict.statusLoading + "</span>";

        fetch(STATUS_API_URL, { cache: "no-store" })
          .then(function (r) {
            if (!r.ok) throw new Error("bad response");
            return r.json();
          })
          .then(function (services) {
            renderStatus(services, lang);
          })
          .catch(function () {
            headline.innerHTML =
              '<span class="status-error">' + dict.statusError + "</span>";
          });
      }

      function applyLocale(lang) {
        document.documentElement.lang = lang;
        var dict = translations[lang];
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (dict[key] !== undefined) el.innerHTML = dict[key];
        });
        document.querySelectorAll("[data-i18n-alt]").forEach(function (el) {
          var key = el.getAttribute("data-i18n-alt");
          if (dict[key] !== undefined) el.alt = dict[key];
        });
        document
          .getElementById("theme-toggle")
          .setAttribute(
            "aria-label",
            lang === "en" ? "Switch theme" : "Cambiar tema",
          );
        document
          .getElementById("lang-toggle")
          .setAttribute(
            "aria-label",
            lang === "en" ? "Switch language" : "Cambiar idioma",
          );
        document.getElementById("lang-toggle").textContent =
          lang === "en" ? "ES" : "EN";
        buildToc();
        loadStatus();
      }

      var tocHeadings = [];
      var tocTicking = false;
      function updateToc() {
        tocTicking = false;
        var current = null;
        tocHeadings.forEach(function (h) {
          if (h.getBoundingClientRect().top <= window.innerHeight * 0.25)
            current = h;
        });
        document.querySelectorAll("#toc-list a").forEach(function (a) {
          if (current && a.getAttribute("href") === "#" + current.id)
            a.setAttribute("aria-current", "location");
          else a.removeAttribute("aria-current");
        });
      }
      function buildToc() {
        var list = document.getElementById("toc-list");
        list.innerHTML = "";
        tocHeadings = Array.prototype.slice.call(
          document.querySelectorAll("main h2"),
        );
        tocHeadings.forEach(function (h) {
          if (!h.id) h.id = h.getAttribute("data-i18n").replace(/H2$/, "");
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.href = "#" + h.id;
          a.textContent = h.textContent;
          li.appendChild(a);
          list.appendChild(li);
        });
        updateToc();
      }
      window.addEventListener(
        "scroll",
        function () {
          if (tocTicking) return;
          tocTicking = true;
          requestAnimationFrame(updateToc);
        },
        { passive: true },
      );

      function toggleLocale() {
        var current = document.documentElement.lang === "en" ? "en" : "es";
        var next = current === "en" ? "es" : "en";
        document.cookie =
          "locale=" +
          next +
          "; Domain=.ncorrea.com.ar; Path=/; Max-Age=31536000; SameSite=Lax";
        applyLocale(next);
      }

      document.addEventListener("DOMContentLoaded", function () {
        var m = document.cookie.match(/(?:^|; )locale=(en|es)/);
        applyLocale(m && m[1] === "en" ? "en" : "es");
        setInterval(loadStatus, 60000);

        if (
          "IntersectionObserver" in window &&
          !matchMedia("(prefers-reduced-motion: reduce)").matches
        ) {
          var io = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (e) {
                if (!e.isIntersecting) return;
                e.target.classList.add("in");
                io.unobserve(e.target);
              });
            },
            { rootMargin: "0px 0px -60px 0px" },
          );
          document.querySelectorAll("main > *").forEach(function (el) {
            el.classList.add("reveal");
            io.observe(el);
          });
        }
      });
    </script>
