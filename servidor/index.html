    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", stored || "dark");
      })();
      function toggleTheme() {
        var current = document.documentElement.getAttribute("data-theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        var effectiveCurrent = current || (prefersDark ? "dark" : "light");
        var next = effectiveCurrent === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        if (typeof updateDiagrams === "function") {
          updateDiagrams(next);
        }
      }
    </script>

      function updateDiagrams(themeName) {
        var suffix = themeName === "light" ? "claro" : "oscuro";

        var archImg = document.getElementById("archDiagramImg");
        var archSrc = "diagrama-arquitectura-" + suffix + ".svg";
        if (archImg) archImg.src = archSrc;

        var openLink = document.getElementById("archOpenFull");
        if (openLink) openLink.href = archSrc;
      }

      updateDiagrams(
        document.documentElement.getAttribute("data-theme") || "dark",
      );
    </script>

            "<strong>Deploying this very page:</strong> a systemd timer on the Raspberry Pi checks the repo's latest commit every 5 minutes and pulls the updated files if it changed. No exposed webhook, no new open port: CD by polling instead of push.",
          originsH2: "Project origins",
          originsP:
            "My personal server started with this same Raspberry Pi 4B. From there, I kept experimenting, testing, and working step by step until I got to this point. Day to day, it helps me both learn and run services without paying for subscriptions.",
          openSourceH2: "Open source",
          openSourceP1:
            "The full configuration is available in the repository:",
          footer: "Last updated: August 2026",
        },
      };

      var STATUS_API_URL = "https://status.ncorrea.com.ar/api/status";

      function formatCheckedAt(raw, lang) {
        if (!raw) return null;
        var d = new Date(raw);
        if (isNaN(d.getTime())) return null;
        return d.toLocaleString(lang === "en" ? "en-US" : "es-AR", {
          timeZone: "America/Argentina/Mendoza",
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }
      function renderStatus(services, lang) {
        var dict = translations[lang];
        var box = document.getElementById("status-box");
        var summary = document.getElementById("status-summary");
        var headline = document.getElementById("status-headline");
        var list = document.getElementById("status-list");
        var anyDown = services.some(function (s) {
          return s.status === "down";
        });
        var upCount = services.filter(function (s) {
          return s.status === "up";
        }).length;

        box.classList.toggle("status-down", anyDown);
        summary.textContent = upCount + "/" + services.length;
        headline.textContent = anyDown ? dict.statusSomeDown : dict.statusAllUp;

        list.innerHTML = "";
        services.forEach(function (s) {
          var status = s.status || "unknown";
          var li = document.createElement("li");

          var nameSpan = document.createElement("span");
          nameSpan.className = "status-name";
          var dot = document.createElement("span");
          dot.className = "status-dot " + status;
          nameSpan.appendChild(dot);
          nameSpan.appendChild(document.createTextNode(s.name));

          var metaSpan = document.createElement("span");
          metaSpan.className = "status-meta";
          var checkedAt = formatCheckedAt(s.checked_at, lang);
          var statusLabel =
            dict["status" + status.charAt(0).toUpperCase() + status.slice(1)] ||
            dict.statusUnknown;
          metaSpan.textContent = checkedAt
            ? statusLabel + " · " + checkedAt
            : statusLabel + " · " + dict.statusNever;

          li.appendChild(nameSpan);
          li.appendChild(metaSpan);
          list.appendChild(li);
        });
      }

      function loadStatus() {
        var lang = document.documentElement.lang === "en" ? "en" : "es";
        var dict = translations[lang];
        var headline = document.getElementById("status-headline");
        headline.innerHTML =
          '<span class="status-loading">' + dict.statusLoading + "</span>";

        fetch(STATUS_API_URL, { cache: "no-store" })
          .then(function (r) {
            if (!r.ok) throw new Error("bad response");
            return r.json();
          })
          .then(function (services) {
            renderStatus(services, lang);
          })
          .catch(function () {
            headline.innerHTML =
              '<span class="status-error">' + dict.statusError + "</span>";
          });
      }

      function applyLocale(lang) {
        document.documentElement.lang = lang;
        var dict = translations[lang];
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (dict[key] !== undefined) el.innerHTML = dict[key];
        });
        document.querySelectorAll("[data-i18n-alt]").forEach(function (el) {
          var key = el.getAttribute("data-i18n-alt");
          if (dict[key] !== undefined) el.alt = dict[key];
        });
        document
          .getElementById("theme-toggle")
          .setAttribute(
            "aria-label",
            lang === "en" ? "Switch theme" : "Cambiar tema",
          );
        document
          .getElementById("lang-toggle")
          .setAttribute(
            "aria-label",
            lang === "en" ? "Switch language" : "Cambiar idioma",
          );
        document.getElementById("lang-toggle").textContent =
          lang === "en" ? "ES" : "EN";
        loadStatus();
      }

      function toggleLocale() {
        var current = document.documentElement.lang === "en" ? "en" : "es";
        var next = current === "en" ? "es" : "en";
        localStorage.setItem("lang", next);
        applyLocale(next);
      }

      document.addEventListener("DOMContentLoaded", function () {
        applyLocale(localStorage.getItem("lang") === "en" ? "en" : "es");
        setInterval(loadStatus, 60000);
      });
    </script>
  </body>
</html>
