    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", stored || "dark");
      })();
      function toggleTheme() {
        var current = document.documentElement.getAttribute("data-theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        var effectiveCurrent = current || (prefersDark ? "dark" : "light");
        var next = effectiveCurrent === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        if (typeof renderArchDiagram === "function") {
          renderArchDiagram(next);
        }
      }
    </script>

      var archDiagramSource = document.getElementById("archSource").textContent;
      var hwDiagramSource = document.getElementById("hwSource").textContent;

      function buildDiagramText(sourceText, themeName) {
        var classDefs = diagramPalettes[themeName].classDefs;
        var lines = Object.keys(classDefs).map(function (name) {
          return "classDef " + name + " " + classDefs[name] + ";";
        });
        return sourceText + "\n" + lines.join("\n");
      }

      function applyMermaidTheme(themeName) {
        var palette = diagramPalettes[themeName] || diagramPalettes.dark;
        mermaid.initialize({
          startOnLoad: false,
          theme: "base",
          themeVariables: {
            background: palette.background,
            primaryColor: palette.primaryColor,
            primaryBorderColor: palette.primaryBorderColor,
            primaryTextColor: palette.primaryTextColor,
            secondaryColor: palette.secondaryColor,
            secondaryBorderColor: palette.secondaryBorderColor,
            tertiaryColor: palette.tertiaryColor,
            tertiaryBorderColor: palette.tertiaryBorderColor,
            lineColor: palette.lineColor,
            textColor: palette.textColor,
            clusterBkg: palette.clusterBkg,
            clusterBorder: palette.clusterBorder,
            edgeLabelBackground: palette.edgeLabelBackground,
            fontFamily: "inherit",
          },
          securityLevel: "loose",
        });
      }

      function svgSize(svgEl) {
        var viewBox = svgEl.getAttribute("viewBox");
        if (viewBox) {
          var parts = viewBox.split(/\s+/).map(Number);
          return { width: parts[2], height: parts[3] };
        }
        return {
          width: parseFloat(svgEl.getAttribute("width")) || 0,
          height: parseFloat(svgEl.getAttribute("height")) || 0,
        };
      }

      function combineSvgs(svgTextA, svgTextB) {
        var parser = new DOMParser();
        var svgA = parser.parseFromString(
          svgTextA,
          "image/svg+xml",
        ).documentElement;
        var svgB = parser.parseFromString(
          svgTextB,
          "image/svg+xml",
        ).documentElement;
        var sizeA = svgSize(svgA);
        var sizeB = svgSize(svgB);
        var width = Math.max(sizeA.width, sizeB.width);
        var height = sizeA.height + sizeB.height;

        var xmlns = "http://www.w3.org/2000/svg";
        var combined = document.createElementNS(xmlns, "svg");
        combined.setAttribute("xmlns", xmlns);
        combined.setAttribute("viewBox", "0 0 " + width + " " + height);
        combined.setAttribute("width", width);
        combined.setAttribute("height", height);

        svgA.setAttribute("x", (width - sizeA.width) / 2);
        svgA.setAttribute("y", 0);
        svgA.setAttribute("width", sizeA.width);
        svgA.setAttribute("height", sizeA.height);
        combined.appendChild(svgA);

        svgB.setAttribute("x", (width - sizeB.width) / 2);
        svgB.setAttribute("y", sizeA.height);
        svgB.setAttribute("width", sizeB.width);
        svgB.setAttribute("height", sizeB.height);
        combined.appendChild(svgB);

        return new XMLSerializer().serializeToString(combined);
      }

      function renderArchDiagram(themeName) {
        applyMermaidTheme(themeName);

        Promise.all([
          mermaid.render(
            "archGraphSvg",
            buildDiagramText(archDiagramSource, themeName),
          ),
          mermaid.render(
            "hwGraphSvg",
            buildDiagramText(hwDiagramSource, themeName),
          ),
        ]).then(function (results) {
          document.getElementById("archContainer").innerHTML = results[0].svg;
          document.getElementById("hwContainer").innerHTML = results[1].svg;

          var openLink = document.getElementById("archOpenFull");
          if (openLink.dataset.blobUrl) {
            URL.revokeObjectURL(openLink.dataset.blobUrl);
          }
          var combinedSvg = combineSvgs(results[0].svg, results[1].svg);
          var url = URL.createObjectURL(
            new Blob([combinedSvg], { type: "image/svg+xml" }),
          );
          openLink.href = url;
          openLink.dataset.blobUrl = url;
        });
      }

      renderArchDiagram(
        document.documentElement.getAttribute("data-theme") || "dark",
      );
    </script>

            "<strong>Utils</strong> — Homepage (dashboard), Uptime Kuma (monitoring), Ntfy (push notifications)",
          decisionsH2: "Technical decisions",
          decision1:

            "My personal server started with a Raspberry Pi 4B. That was the project that got this whole idea going. Day to day, it helps me both learn and run services without paying for subscriptions. That Raspberry Pi is now linked to the main node, giving redundancy to core services like Vaultwarden, Pi-hole, and Unbound. This keeps things available even if something goes wrong.",

          footer: "Last updated: August 2026",
          uptimePrefix: "The last restart was on ",
          uptimeFallbackLabel: "Active since",
          uptimeUnavailable: "uptime not available",
        },
      };

      var bootEpoch = null;

      function formatFecha(d, lang) {
        return d.toLocaleDateString(lang === "en" ? "en-US" : "es-AR", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      }

      function renderUptime(lang) {
        var labelEl = document.getElementById("uptime-label");
        var counterEl = document.getElementById("uptime-counter");
        var dict = translations[lang];
        if (bootEpoch === null) {
          labelEl.textContent = dict.uptimeLabelPlaceholder;
          counterEl.textContent = dict.uptimeCalculating;
          return;
        }
        labelEl.textContent =
          dict.uptimePrefix + formatFecha(new Date(bootEpoch * 1000), lang);
      }

      function updateCounter() {
        if (bootEpoch === null) return;
        var counterEl = document.getElementById("uptime-counter");
        var diff = Date.now() - bootEpoch * 1000;
        var days = Math.floor(diff / 86400000);
        var hours = Math.floor((diff % 86400000) / 3600000);
        var mins = Math.floor((diff % 3600000) / 60000);
        var secs = Math.floor((diff % 60000) / 1000);
        counterEl.textContent =
          days + "d " + hours + "h " + mins + "m " + secs + "s";
      }

      function applyLocale(lang) {
        document.documentElement.lang = lang;
        var dict = translations[lang];
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (dict[key] !== undefined) el.innerHTML = dict[key];
        });
        document.querySelectorAll("[data-i18n-alt]").forEach(function (el) {
          var key = el.getAttribute("data-i18n-alt");
          if (dict[key] !== undefined) el.alt = dict[key];
        });
        document
          .getElementById("theme-toggle")
          .setAttribute(
            "aria-label",
            lang === "en" ? "Switch theme" : "Cambiar tema",
          );
        document
          .getElementById("lang-toggle")
          .setAttribute(
            "aria-label",
            lang === "en" ? "Switch language" : "Cambiar idioma",
          );
        document.getElementById("lang-toggle").textContent =
          lang === "en" ? "ES" : "EN";
        renderUptime(lang);
      }

      function toggleLocale() {
        var current = document.documentElement.lang === "en" ? "en" : "es";
        var next = current === "en" ? "es" : "en";
        localStorage.setItem("lang", next);
        applyLocale(next);
      }

      document.addEventListener("DOMContentLoaded", function () {
        applyLocale(localStorage.getItem("lang") === "en" ? "en" : "es");

        fetch("boot.json", { cache: "no-store" })
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            bootEpoch = data.boot_epoch;
            renderUptime(document.documentElement.lang === "en" ? "en" : "es");
            updateCounter();
            setInterval(updateCounter, 1000);
          })
          .catch(function () {
            var lang = document.documentElement.lang === "en" ? "en" : "es";
            document.getElementById("uptime-label").textContent =
              translations[lang].uptimeFallbackLabel;
            document.getElementById("uptime-counter").textContent =
              translations[lang].uptimeUnavailable;
          });
      });
    </script>
  </body>
</html>
