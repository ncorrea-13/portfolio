    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        document.documentElement.setAttribute("data-theme", stored || "dark");
      })();
      function toggleTheme() {
        var current = document.documentElement.getAttribute("data-theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        var effectiveCurrent = current || (prefersDark ? "dark" : "light");
        var next = effectiveCurrent === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        if (typeof updateDiagrams === "function") {
          updateDiagrams(next);
        }
      }
    </script>

      var bootEpoch = null;

      function formatFecha(d, lang) {
        return d.toLocaleDateString(lang === "en" ? "en-US" : "es-AR", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      }

      function renderUptime(lang) {
        var labelEl = document.getElementById("uptime-label");
        var counterEl = document.getElementById("uptime-counter");
        var dict = translations[lang];
        if (bootEpoch === null) {
          labelEl.textContent = dict.uptimeLabelPlaceholder;
          counterEl.textContent = dict.uptimeCalculating;
          return;
        }
        labelEl.textContent =
          dict.uptimePrefix + formatFecha(new Date(bootEpoch * 1000), lang);
      }

      function updateCounter() {
        if (bootEpoch === null) return;
        var counterEl = document.getElementById("uptime-counter");
        var diff = Date.now() - bootEpoch * 1000;
        var days = Math.floor(diff / 86400000);
        var hours = Math.floor((diff % 86400000) / 3600000);
        var mins = Math.floor((diff % 3600000) / 60000);
        var secs = Math.floor((diff % 60000) / 1000);
        counterEl.textContent =
          days + "d " + hours + "h " + mins + "m " + secs + "s";
      }

      function applyLocale(lang) {
        document.documentElement.lang = lang;
        var dict = translations[lang];
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (dict[key] !== undefined) el.innerHTML = dict[key];
        });
        document.querySelectorAll("[data-i18n-alt]").forEach(function (el) {
          var key = el.getAttribute("data-i18n-alt");
          if (dict[key] !== undefined) el.alt = dict[key];
        });
        document
          .getElementById("theme-toggle")
          .setAttribute(
            "aria-label",
            lang === "en" ? "Switch theme" : "Cambiar tema",
          );
        document
          .getElementById("lang-toggle")
          .setAttribute(
            "aria-label",
            lang === "en" ? "Switch language" : "Cambiar idioma",
          );
        document.getElementById("lang-toggle").textContent =
          lang === "en" ? "ES" : "EN";
        renderUptime(lang);
      }

      function toggleLocale() {
        var current = document.documentElement.lang === "en" ? "en" : "es";
        var next = current === "en" ? "es" : "en";
        localStorage.setItem("lang", next);
        applyLocale(next);
      }

      document.addEventListener("DOMContentLoaded", function () {
        applyLocale(localStorage.getItem("lang") === "en" ? "en" : "es");

        fetch("boot.json", { cache: "no-store" })
          .then(function (r) {
            return r.json();
          })
          .then(function (data) {
            bootEpoch = data.boot_epoch;
            renderUptime(document.documentElement.lang === "en" ? "en" : "es");
            updateCounter();
            setInterval(updateCounter, 1000);
          })
          .catch(function () {
            var lang = document.documentElement.lang === "en" ? "en" : "es";
            document.getElementById("uptime-label").textContent =
              translations[lang].uptimeFallbackLabel;
            document.getElementById("uptime-counter").textContent =
              translations[lang].uptimeUnavailable;
          });
      });
